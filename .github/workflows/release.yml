name: Build & Release Multiplatform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            artifact_name: gemini-code-windows-x64.exe
          - os: windows-latest
            target: windows-x86
            artifact_name: gemini-code-windows-x86.exe
            python_arch: x86
          - os: macos-latest
            target: macos-universal
            artifact_name: gemini-code-macos
          - os: ubuntu-latest
            target: linux-x64
            artifact_name: gemini-code-linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch || 'x64' }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onefile --name gemini-code gemini_code/cli.py

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          Move-Item dist/gemini-code.exe dist/${{ matrix.artifact_name }}

      - name: Rename artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mv dist/gemini-code dist/${{ matrix.artifact_name }}
          chmod +x dist/${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten artifacts
        run: |
          mkdir final-assets
          find release-artifacts -type f -exec mv {} final-assets/ \;
          ls -la final-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: final-assets/*
          name: Gemini Code Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
