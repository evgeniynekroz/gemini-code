name: Build & Release Multiplatform Binaries

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            artifact_name: gemini-code-windows-x64.exe
          - os: windows-latest
            target: windows-x86
            artifact_name: gemini-code-windows-x86.exe
            python_arch: x86
          - os: macos-latest
            target: macos
            artifact_name: gemini-code-macos
          - os: ubuntu-latest
            target: linux-x64
            artifact_name: gemini-code-linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch || 'x64' }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --collect-all gemini_code --name ${{ matrix.artifact_name }} gemini_code/cli.py

      - name: Build executable with PyInstaller (Unix)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --onefile --collect-all gemini_code --name ${{ matrix.artifact_name }} gemini_code/cli.py
          chmod +x dist/${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p final-assets
          find release-artifacts -type f -exec cp {} final-assets/ \;
          ls -la final-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: final-assets/*
          tag_name: v1.0.0
          name: Gemini Code v1.0.0 (Windows 64/32-bit, macOS, Linux)
          body: |
            ## ⚡ Gemini Code v1.0.0 Release
            
            ### 📦 Готовые сборки для скачивания:
            - 🪟 **[gemini-code-windows-x64.exe](https://github.com/evgeniynekroz/gemini-code/releases/download/v1.0.0/gemini-code-windows-x64.exe)** — Windows 64-бит
            - 🪟 **[gemini-code-windows-x86.exe](https://github.com/evgeniynekroz/gemini-code/releases/download/v1.0.0/gemini-code-windows-x86.exe)** — Windows 32-бит
            - 🍏 **[gemini-code-macos](https://github.com/evgeniynekroz/gemini-code/releases/download/v1.0.0/gemini-code-macos)** — Apple macOS
            - 🐧 **[gemini-code-linux-x64](https://github.com/evgeniynekroz/gemini-code/releases/download/v1.0.0/gemini-code-linux-x64)** — Linux
            
            ### ☕ Поддержать автора:
            - **DonationAlerts:** https://www.donationalerts.com/r/nekrozdev
            - **CryptoBot:** `@send @NekrozDEV` в Telegram
          draft: false
          prerelease: false
